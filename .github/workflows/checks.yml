name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Run offline protocol, controller, transport and IPC tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n scripts/run-backend scripts/setup-backend scripts/install-local
